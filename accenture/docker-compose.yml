services:
  db:
    image: mysql:8.3
    container_name: franchise-mysql
    environment:
      MYSQL_DATABASE: franchise_db
      MYSQL_ROOT_PASSWORD: root_pass
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot_pass"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: accenture
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/franchise_db?useSSL=NO&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: franchise_user
      SPRING_DATASOURCE_PASSWORD: franchise_pass
    ports:
      - "8081:8080"

volumes:
  db_data: